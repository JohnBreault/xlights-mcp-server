[project]
name = "xlights-mcp-server"
version = "0.1.0"
description = "MCP server for generating xLights sequences from music analysis"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.2.0,<2",
    "librosa>=0.10.0",
    "numpy>=1.24.0",
    "pyloudnorm>=0.1.1",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "lxml>=5.0.0",
    "soundfile>=0.12.0",
]

[project.optional-dependencies]
separation = [
    "demucs>=4.0.0",
    "torch>=2.0.0",
]
beats = [
    "madmom>=0.16.1",
]
lyrics = [
    "openai-whisper>=20230918",
    "torch>=2.0.0",
]
all = [
    "xlights-mcp-server[separation,beats,lyrics]",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[project.scripts]
xlights-mcp-server = "xlights_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xlights_mcp"]

# Avoid building this optional legacy release just to resolve default dependencies.
[[tool.uv.dependency-metadata]]
name = "madmom"
version = "0.16.1"
requires-dist = ["numpy>=1.13.4", "scipy>=0.16", "cython>=0.25", "mido>=1.2.8"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
