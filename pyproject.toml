[project]
name = "xlights-mcp-server"
version = "0.1.0"
description = "MCP server for generating xLights sequences from music analysis"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.2.0,<2",
    "librosa>=0.10.0",
    "numpy>=1.24.0",
    "numpy>=2; sys_platform == 'darwin' and platform_machine == 'x86_64' and python_version >= '3.13'",
    "numba<0.62; sys_platform == 'darwin' and platform_machine == 'x86_64' and python_version < '3.13'",
    "pyloudnorm>=0.1.1",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "lxml>=5.0.0",
    "soundfile>=0.12.0",
]

[project.optional-dependencies]
separation = [
    "demucs>=4.0.0",
    "numpy<2; sys_platform == 'darwin' and platform_machine == 'x86_64' and python_version < '3.13'",
    "torch>=2.2.0,<2.3.0; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torchaudio>=2.2.0,<2.3.0; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torch>=2.4.1; sys_platform != 'darwin' or platform_machine != 'x86_64'",
]
beats = [
    "madmom-modern @ https://github.com/imcmurray/madmom-modern/archive/df718c704a3b460ac6c61b7e61663a0436b91bda.tar.gz ; sys_platform != 'darwin' or platform_machine != 'x86_64'",
]
lyrics = [
    "openai-whisper>=20230918",
    "numpy<2; sys_platform == 'darwin' and platform_machine == 'x86_64' and python_version < '3.13'",
    "torch>=2.2.0,<2.3.0; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torch>=2.3.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
]
all = [
    "xlights-mcp-server[separation,beats,lyrics]",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[project.scripts]
xlights-mcp-server = "xlights_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xlights_mcp"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
